name: Convert sold images

# Converts new CMYK/oversized sold-property photos to sRGB web JPEGs so the site
# serves them without the paid Supabase image-transform endpoint. Runs every
# morning (06:00 Asia/Dubai) and only processes images not yet converted.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 06:00 Asia/Dubai
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: convert-sold-images
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sharp
        run: npm install --no-save sharp@^0.33

      - name: Convert new sold images
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/convert-sold-images.mjs

      - name: Commit updated manifest if changed
        run: |
          git config user.name "eqt-image-bot"
          git config user.email "bot@users.noreply.github.com"
          git add lib/data/converted-sold.json
          if git diff --staged --quiet; then
            echo "No new images to record."
          else
            git commit -m "chore: update converted sold-image manifest [skip ci]"
            git push
          fi
