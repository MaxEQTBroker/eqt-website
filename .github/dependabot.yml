# Dependabot: weekly scan for vulnerable/outdated npm packages. Opens PRs with the
# fix so security patches don't silently pile up again. Review + merge like any PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Never auto-open MAJOR version bumps (e.g. Next 15->16, TypeScript 5->7): they
    # carry breaking changes, fail preview builds, and must be done as a deliberate,
    # tested task. Security fixes for actual vulnerabilities still come through.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Bundle minor/patch bumps into one PR to cut noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
